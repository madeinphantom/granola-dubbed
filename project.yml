name: Atrium
options:
  bundleIdPrefix: app
  deploymentTarget:
    macOS: 15.0

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 0.9.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  Atrium:
    type: application
    platform: macOS
    sources: [Atrium]
    info:
      path: Atrium/Info.plist
      properties:
        LSUIElement: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Sparkle appcast. Served from the "latest" release assets so no
        # GitHub Pages site is required; this URL always redirects to the
        # newest published release.
        SUFeedURL: "https://github.com/madeinphantom/granola-dubbed/releases/latest/download/appcast.xml"
        SUEnableInstallerLauncherService: false
        # Public half of the EdDSA keypair; the private key lives in the
        # maintainer's login keychain and in the SPARKLE_PRIVATE_KEY secret.
        SUPublicEDKey: "xu20n7vmRUS3AxPr06MkvulnTZGKXs6yq3LZZLq3mqs="
        NSMicrophoneUsageDescription: "Atrium needs microphone access to record your voice during meetings."
        NSScreenCaptureUsageDescription: "Atrium needs screen recording access to capture system audio from your meetings."
    entitlements:
      # Defined here rather than in the file itself: xcodegen regenerates the
      # .entitlements file on every run and would overwrite hand edits.
      path: Atrium/Atrium.entitlements
      properties:
        # Required for mic capture. Sandbox stays off because the CoreAudio
        # process-tap and aggregate-device APIs are unavailable inside it.
        com.apple.security.device.audio-input: true
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.atrium.mac
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: "" # Needs to be configured by the user
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - package: WhisperKit
      - package: Sparkle

  AtriumTests:
    type: bundle.unit-test
    platform: macOS
    sources: [AtriumTests]
    dependencies:
      - target: Atrium
