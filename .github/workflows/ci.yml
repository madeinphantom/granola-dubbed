name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -scheme Atrium \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      # The unit tests are pure logic; hosting them in the app would launch
      # SwiftUI and Sparkle's updater on a headless runner, which hangs.
      - name: Test
        timeout-minutes: 10
        run: |
          set -o pipefail
          # Stream to a file so a hang still leaves evidence of the last test
          # that started, then print it from a step that always runs.
          xcodebuild test \
            -scheme Atrium \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1 &
          XCB=$!
          # Print progress while it runs so the log is never empty.
          while kill -0 $XCB 2>/dev/null; do
            sleep 15
            grep -E "Test Case .* started|Test Suite .* started" test.log | tail -1 || true
          done
          wait $XCB

      - name: Show last test that started
        if: always()
        run: |
          echo "--- last 60 lines ---"
          tail -60 test.log || true
          echo "--- test cases seen ---"
          grep -E "Test Case|Test Suite" test.log | tail -25 || true
