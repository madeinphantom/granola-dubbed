name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -scheme Atrium \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      # The unit tests are pure logic; hosting them in the app would launch
      # SwiftUI and Sparkle's updater on a headless runner, which hangs.
      - name: Test
        timeout-minutes: 10
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Atrium \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -80
