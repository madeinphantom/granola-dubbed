name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show versions
        run: swift --version

      # The unit tests are pure logic; nothing touches audio hardware.
      - name: Test
        timeout-minutes: 10
        run: scripts/atrium test

      # Signs ad hoc on the runner and fails if the audio-input entitlement is
      # missing from the signed app.
      - name: Build app
        run: scripts/atrium build
