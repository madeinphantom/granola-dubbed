name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.5.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build DMG
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: echo "value=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Test
        timeout-minutes: 10
        run: scripts/atrium test

      # macOS keys Microphone and Screen & System Audio Recording grants on the
      # app's designated requirement. An ad-hoc signature changes it on every
      # build, so each update would silently revoke system audio. A fixed
      # self-signed certificate keeps the requirement identical across releases.
      - name: Import signing identity
        env:
          P12: ${{ secrets.ATRIUM_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.ATRIUM_SIGNING_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "error: ATRIUM_SIGNING_P12 secret missing" >&2; exit 1
          fi
          KC="$RUNNER_TEMP/atrium.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/atrium.p12"
          security import "$RUNNER_TEMP/atrium.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/atrium.p12"

      - name: Build app
        env:
          ATRIUM_VERSION: ${{ steps.tag.outputs.value }}
        run: |
          ATRIUM_VERSION="${ATRIUM_VERSION#v}" scripts/atrium build
          # The build signs ad hoc when the identity is missing; a release must not.
          codesign -d -r- dist/Atrium.app 2>&1 | tee requirement.txt
          grep -q "certificate leaf" requirement.txt \
            || { echo "error: release is not signed with the stable identity" >&2; exit 1; }

      - name: Build DMG
        run: |
          mkdir -p dist/dmg
          cp -R dist/Atrium.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Atrium" -srcfolder dist/dmg -ov -format UDZO dist/Atrium.dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'NOTES'
          Local-first call recorder for macOS. Requires macOS 15+ on Apple Silicon.

          ## Install

          1. Download `Atrium.dmg`, open it, drag **Atrium** to Applications.
          2. This build is not notarized, so clear the download quarantine:

             ```bash
             xattr -dr com.apple.quarantine /Applications/Atrium.app
             ```

          3. Open Atrium. Allow **Microphone**, then turn Atrium on in System
             Settings › Privacy & Security › **Screen & System Audio Recording**
             and reopen it.

          Press ⌃⌥⌘R to start and stop recording. The Whisper model (about 1 GB)
          downloads on first use.

          ## Known limits

          - Everyone on the far side of the call is one speaker, "Them".
          NOTES

          TAG="${{ steps.tag.outputs.value }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Atrium.dmg --clobber
          else
            gh release create "$TAG" dist/Atrium.dmg --title "Atrium $TAG" --notes-file notes.md
          fi
